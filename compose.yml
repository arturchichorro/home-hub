services:
  postgres:
    image: postgres:17
    container_name: home-hub-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: home_hub
      POSTGRES_PASSWORD: home_hub
      POSTGRES_DB: home_hub
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - home_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_hub -d home_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
  zero-cache:
    image: rocicorp/zero:1.8.0
    container_name: home-hub-zero-cache
    restart: unless-stopped
    stop_grace_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4848:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://home_hub:home_hub@postgres:5432/home_hub
      ZERO_CVR_DB: postgres://home_hub:home_hub@postgres:5432/home_hub
      ZERO_CHANGE_DB: postgres://home_hub:home_hub@postgres:5432/home_hub
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD}
      ZERO_APP_ID: home_hub
      ZERO_APP_PUBLICATIONS: home_hub_zero
      ZERO_QUERY_URL: http://host.docker.internal:3000/zero/query
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_NUM_SYNC_WORKERS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - home_hub_zero_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 5s
      start_period: 10m
      retries: 10

volumes:
  home_hub_postgres_data:
  home_hub_zero_data:
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: home_hub
          POSTGRES_PASSWORD: home_hub
          # Test fixtures refuse database names without the home_hub_test_ prefix.
          POSTGRES_DB: home_hub_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_hub -d home_hub_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Verify generated Zero schema
        run: |
          pnpm --filter @home-hub/database zero:generate
          pnpm exec biome format --write packages/shared/src/zero/schema.gen.ts
          git diff --exit-code -- packages/shared/src/zero/schema.gen.ts

      - name: Verify Drizzle migrations
        env:
          DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub_test_ci
        run: |
          pnpm db:generate
          changes="$(git status --porcelain --untracked-files=all -- packages/database/drizzle)"
          if [ -n "$changes" ]; then
            echo "Drizzle schema and committed migrations are out of sync:"
            echo "$changes"
            git diff -- packages/database/drizzle
            exit 1
          fi

      - name: Apply complete migration history with Zero schema collision
        env:
          DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub_test_ci
        run: |
          # Zero creates a schema matching POSTGRES_USER in production.
          docker exec "${{ job.services.postgres.id }}" \
            psql -U home_hub -d home_hub_test_ci -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA home_hub;'
          pnpm db:migrate
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U home_hub -d home_hub_test_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT FROM pg_tables WHERE schemaname = 'home_hub') THEN
              RAISE EXCEPTION 'Application tables must not be created in the Zero schema';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_tables WHERE schemaname = 'public') THEN
              RAISE EXCEPTION 'Migration history did not create application tables in public';
            END IF;
          END $$;
          SQL

      - name: Run test suite
        env:
          # Include database integration tests against the disposable CI service.
          TEST_DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub_test_ci
        run: pnpm test

      - name: Build production web application
        env:
          VITE_ZERO_CACHE_URL: https://home.achichorro.com/zero
        run: pnpm --filter @home-hub/web build

      - name: Verify production image Worker bundle
        run: >-
          pnpm --filter @home-hub/image-delivery exec wrangler deploy
          --dry-run --env production

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://home.achichorro.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy production image Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @home-hub/image-delivery deploy:production

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/home_hub_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/home_hub_deploy ~/.ssh/known_hosts

      - name: Deploy verified main revision
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: bash scripts/deploy-via-ssh.sh

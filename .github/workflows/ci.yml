name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Verify generated Zero schema
        run: |
          pnpm --filter @home-hub/database zero:generate
          pnpm exec biome format --write packages/shared/src/zero/schema.gen.ts
          git diff --exit-code -- packages/shared/src/zero/schema.gen.ts

      - name: Verify Drizzle migrations
        env:
          DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub
        run: |
          pnpm db:generate
          changes="$(git status --porcelain --untracked-files=all -- packages/database/drizzle)"
          if [ -n "$changes" ]; then
            echo "Drizzle schema and committed migrations are out of sync:"
            echo "$changes"
            git diff -- packages/database/drizzle
            exit 1
          fi

      - name: Build production web application
        env:
          VITE_ZERO_CACHE_URL: https://home.achichorro.com/zero
        run: pnpm --filter @home-hub/web build

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://home.achichorro.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/home_hub_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/home_hub_deploy ~/.ssh/known_hosts

      - name: Deploy verified main revision
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -T \
            -i ~/.ssh/home_hub_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=10 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST"

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: home_hub
          POSTGRES_PASSWORD: home_hub
          POSTGRES_DB: home_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_hub -d home_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Verify generated Zero schema
        run: |
          pnpm --filter @home-hub/database zero:generate
          pnpm exec biome format --write packages/shared/src/zero/schema.gen.ts
          git diff --exit-code -- packages/shared/src/zero/schema.gen.ts

      - name: Verify Drizzle migrations
        env:
          DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub
        run: |
          pnpm db:generate
          changes="$(git status --porcelain --untracked-files=all -- packages/database/drizzle)"
          if [ -n "$changes" ]; then
            echo "Drizzle schema and committed migrations are out of sync:"
            echo "$changes"
            git diff -- packages/database/drizzle
            exit 1
          fi

      - name: Apply complete migration history with Zero schema collision
        env:
          DATABASE_URL: postgres://home_hub:home_hub@127.0.0.1:5432/home_hub
        run: |
          # Zero creates a schema matching POSTGRES_USER in production.
          docker exec "${{ job.services.postgres.id }}" \
            psql -U home_hub -d home_hub -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA home_hub;'
          pnpm db:migrate
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U home_hub -d home_hub -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT FROM pg_tables WHERE schemaname = 'home_hub')
              OR to_regclass('public.lists') IS NULL
              OR to_regclass('public.list_items') IS NULL THEN
              RAISE EXCEPTION 'Application tables must be created in public';
            END IF;
            IF to_regclass('public.shopping_items') IS NOT NULL
              OR to_regclass('public.shopping_list_migration_links') IS NOT NULL
              OR to_regtype('public.shopping_item_status') IS NOT NULL
              OR to_regprocedure('public.mirror_shopping_item_to_lists()') IS NOT NULL
              OR to_regprocedure('public.mirror_shopping_module_to_lists()') IS NOT NULL
              OR EXISTS (
                SELECT FROM public.household_module_settings WHERE module_key = 'shopping'
              )
              OR EXISTS (
                SELECT FROM pg_publication_tables
                WHERE pubname = 'home_hub_zero' AND tablename = 'shopping_items'
              ) THEN
              RAISE EXCEPTION 'Retired Shopping database objects must be removed';
            END IF;
          END $$;
          SQL

      - name: Build production web application
        env:
          VITE_ZERO_CACHE_URL: https://home.achichorro.com/zero
        run: pnpm --filter @home-hub/web build

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://home.achichorro.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/home_hub_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/home_hub_deploy ~/.ssh/known_hosts

      - name: Deploy verified main revision
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -T \
            -i ~/.ssh/home_hub_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=10 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST"
